# 빗썸 자동매매 설정 — Claude가 튜닝 루프에서 이 파일을 조정한다.
# 운용 규모: 초기 1,000,000 KRW / 성향: 하이리스크

mode:
  dry_run: true            # true = 페이퍼 트레이딩(실주문 없음). 실전 전환은 사용자 승인 후 false로.
  poll_interval_sec: 10    # 시세 폴링 주기

universe:                  # 대상 코인 (빗썸 KRW 마켓, 유동성 상위 위주)
  - KRW-BTC
  - KRW-ETH
  - KRW-XRP
  - KRW-SOL
  - KRW-DOGE
  - KRW-ADA

strategy:
  name: ma_trend           # 강건성 스윕(30조합) 통과 전략 — 변동성 돌파는 백테스트 탈락
  ma_len: 30               # 이동평균 기간 (10~50 전 구간 유효, 30이 최적)
  band: 0.03               # 진입 MA+3% / 이탈 MA-3% 이력대 (휩쏘 비용 절감)
  rebal_days: 7            # 주 1회 판단
  reset_hour_kst: 0        # 거래일 리셋 시각 (KST)
  # --- 이하 volatility_breakout 전용 (name 변경 시에만 사용) ---
  k: 0.5
  per_coin_k: {}
  trend_filter_ma: 5

risk:
  position_pct: 0.16       # 슬롯 크기 참고값 (추세 전략은 총자산/6 슬롯 사용)
  max_positions: 6         # 6코인 전부 추세일 때 전량 보유 가능
  stop_loss_pct: 0.15      # 재난 방어선 — 추세 이탈(-3% 밴드)이 주 출구, 급락 시 -15% 강제 손절
  daily_loss_limit_pct: 0.08   # 당일 총자산 -8% → 당일 신규 매수 중단
  kill_switch_pct: 0.40    # 고점 대비 -40% → 전량 매도 + 정지. 전략 역사적 MDD 37%보다 바깥의 재난 브레이크
  crash_guard_pct: 0.10    # 5분 내 ±10% 급변 코인 신규 진입 금지
  min_order_krw: 5500      # 최소 주문 금액 여유분 (실제 한도는 API로 재확인)
  max_daily_buys: 12       # 리밸런싱일 전 코인 교체까지 허용

settle:
  target_krw: 20000        # 누적 이익이 이 금액에 닿으면 그만큼 현금 분리 후 출금 알림
                           # 0으로 두면 이익 분리 없이 전액 재투자(자산증식 모드)

fee:
  coupon_renewed_on: "2026-08-22"   # 빗썸 0.04% 쿠폰 신청일 (30일마다 재신청 후 이 날짜 갱신)

notify:
  telegram: true          # true 설정 + TG_BOT_TOKEN/TG_CHAT_ID 환경변수 필요
